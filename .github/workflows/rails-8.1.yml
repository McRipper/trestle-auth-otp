name: Rails 8.1

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
        assets: [sprockets-rails, propshaft]
    env:
      ASSET_PIPELINE: ${{ matrix.assets }}
      SKIP_COVERAGE_UPLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
